name: Report regressions
on:
  pull_request:
    paths:
      - 'app.py'
      - 'report_summary.py'
      - 'import_bulk.py'
      - 'policy_reports.py'
      - 'premium_precision.py'
      - 'tests/**'
      - '.github/workflows/report-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pypdf
      - run: python -m unittest discover -s tests -p 'test_report_summary*.py'
      - run: python -m unittest discover -s tests -p 'test_policy_import.py'
      - run: python -m unittest discover -s tests -p 'test_import_session.py'
      - run: node tests/test_import_queue.js

  premium-precision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: precision_test
          POSTGRES_DB: precision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRECISION_TEST_DATABASE_URL: postgresql+psycopg2://postgres:precision_test@localhost:5432/precision_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_premium_precision.py'
