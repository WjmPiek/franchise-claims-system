<section class="exec-grid">{% for graph in central_graphs %}<div class="exec-card span-6"><h2><a href="{{ url_for('central_calculation_detail',category=graph.category,franchise=selected,**range_args) }}">{{ graph.label }}</a></h2><svg class="line-chart" id="centralGraph{{ graph.key }}" viewBox="0 0 600 210" preserveAspectRatio="none" data-direct-series="{{ graph.points|tojson|forceescape }}" data-unit="{{ graph.unit }}"></svg><table class="exec-table"><thead><tr><th>Receipt / paid month</th><th>{{ graph.label }}</th></tr></thead><tbody>{% for point in graph.points %}<tr><td><a href="{{ point.url }}">{{ point.label }}</a></td><td>{{ point.value|int if graph.unit=='rows' else point.value|money }}</td></tr>{% else %}<tr><td colspan="2">No verified data in this selection.</td></tr>{% endfor %}</tbody></table></div>{% endfor %}</section>
