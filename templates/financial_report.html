<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }} | Martin's Funerals</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f6f5f9;color:#202030}
main{margin:16px auto;max-width:1600px;padding:16px}
h1{margin:0 0 8px}nav{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
a{color:#6b4aa0}nav a{padding:10px;border:1px solid #6b4aa0;border-radius:6px;background:white}
.report-preview{display:block;width:100%;height:calc(100vh - 190px);min-height:520px;border:1px solid #ddd;background:#eee}
@media(max-width:600px){main{margin:0;padding:12px}.report-preview{height:75vh;min-height:400px}}
</style>
</head>
<body><main>
<h1>{{ title }}</h1><p>{{ period }}</p>
<nav>
<a href="{{ url_for('dashboard') }}#downloadReports">Back to dashboard</a>
<a href="{{ excel_url }}">Download {{ title }} Excel</a>
<a href="{{ pdf_url }}">Download {{ title }} PDF</a>
<a href="{{ preview_url }}" target="_blank" rel="noopener">Open PDF preview</a>
</nav>
<object class="report-preview" data="{{ preview_url }}" type="application/pdf" aria-label="{{ title }} PDF report preview">
<p><a href="{{ preview_url }}" target="_blank" rel="noopener">Open {{ title }} PDF preview</a></p>
</object>
</main></body></html>
