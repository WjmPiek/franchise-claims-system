{% set maximum=(bars|map(attribute='value')|max) if bars else 1 %}<div class="chart-bars">{% for bar in bars %}<div class="product-bar"><span title="{{ bar.label }}">{{ loop.index }}. {{ bar.label }}</span><div class="bar-track"><div class="bar-fill" style="width:{{ bar.value/(maximum or 1)*100 }}%"></div></div><strong>{{ bar.value|money if bar_kind=='money' else '{:,}'.format(bar.value) }}</strong></div>{% else %}<p class="muted">No policy data for this selection.</p>{% endfor %}</div>
