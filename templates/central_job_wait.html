<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title><link rel="stylesheet" href="{{ url_for('static',filename='central-compliance.css') }}"></head><body><main class="central-page"><a href="{{ url_for('overview_page',section='downloads') }}">Reports & Downloads</a><h1>{{ title }}</h1><p id="jobStatus" role="status">Queued for background preparation. The task continues if this page is closed.</p><progress id="jobProgress"></progress><p id="jobError"></p></main><script>const status=document.getElementById('jobStatus'),progress=document.getElementById('jobProgress');async function poll(){try{const response=await fetch('{{ url_for("central_job_status",identifier=identifier) }}',{cache:'no-store'});if(!response.ok)throw Error('Sign in again to check this task.');const job=await response.json();status.textContent=job.stage+' — '+job.current_rows.toLocaleString()+' rows — '+job.elapsed_seconds+' seconds elapsed';if(job.total_rows){progress.max=job.total_rows;progress.value=job.current_rows;}if(job.state==='completed'){location.replace('{{ url_for("central_report_download",identifier=identifier,format=format) }}');return;}if(job.state==='failed'){document.getElementById('jobError').textContent=job.error;return;}setTimeout(poll,2000);}catch(e){document.getElementById('jobError').textContent=e.message;}}poll();</script></body></html>
