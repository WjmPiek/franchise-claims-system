<!doctype html><html><head><meta charset="utf-8"><title>Analysing saved claims</title></head><body><h1>Analysing saved claims sources</h1><p id="status" role="status">Queued. Paid-claim publications remain unchanged.</p><a href="{{ url_for('overview_page',section='claims') }}">Back to Claims analytics</a><script>const timer=setInterval(async()=>{try{const response=await fetch({{ url_for('central_job_status',identifier=identifier)|tojson }});const data=await response.json();const job=data.job||data;document.getElementById('status').textContent=job.stage+' · '+job.current_rows+' source rows';if(job.state==='completed'){clearInterval(timer);location.href={{ url_for('overview_page',section='claims')|tojson }};}else if(job.state==='failed'){clearInterval(timer);document.getElementById('status').textContent=job.error;}}catch(e){document.getElementById('status').textContent='Connection interrupted. The server keeps processing; reload Claims analytics later.';}},2000);</script></body></html>
