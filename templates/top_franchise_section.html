            <div class="exec-card span-12" id="topFranchises"><h2>Top Franchise Claims Detail</h2><table class="exec-table"><thead><tr><th>Franchise</th><th>Premium</th><th>Claims</th><th>No. Claims</th><th>Loss Ratio</th></tr></thead><tbody>{% for r in ed.get('top_franchise_rows', []) %}<tr><td><a href="{{ url_for('dashboard', franchise=r.franchise, dashboard_period_view=dashboard_period_view) }}">{{ r.franchise }}</a></td><td>{{ r.premium|money }}</td><td>{{ r.claims|money }}</td><td>{{ r.claim_count|int }}</td><td>{{ r.ratio|pct }}</td></tr>{% else %}<tr><td colspan="5">No imported data yet.</td></tr>{% endfor %}</tbody></table></div>
