<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client Heatmap</title>
  <link rel="icon" href="{{ url_for('static', filename='martins_logo.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='martins_logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='martins-20260802') }}">
  <style>
    :root { --md-ink:#18202a; --md-bg:#f7f8fb; --md-card:#ffffff; --md-line:#dce2e8; --md-accent:#6B4AA0; --md-muted:#64707d; }
    body { background:var(--md-bg); color:var(--md-ink); }
    .heatmap-page { max-width:1400px; margin:14px auto; padding:0 14px; }
    .heatmap-header { background:#fff; border:1px solid var(--md-line); border-radius:12px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; box-shadow:0 10px 26px rgba(24,32,42,.08); }
    .heatmap-header h1 { margin:0; font-size:20px; }
    .heatmap-header p { margin:4px 0 0; color:#64707d; font-size:12px; }
    .heatmap-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
    .heatmap-actions a, .heatmap-actions button { background:#6B4AA0; color:#fff; border:0; border-radius:10px; padding:9px 12px; font-weight:800; text-decoration:none; cursor:pointer; }
    .heatmap-actions button.secondary, .heatmap-actions a.secondary { background:#8f73bd; color:#fff; }
    .heatmap-actions select { border:1px solid var(--md-line); border-radius:6px; padding:9px 10px; font-weight:800; background:#fff; min-width:320px; }
    .heatmap-shell { background:#fff; border:1px solid var(--md-line); border-radius:12px; padding:12px; box-shadow:0 10px 26px rgba(24,32,42,.08); }
    #clientHeatmap { width:100%; height:calc(100vh - 220px); min-height:530px; border-radius:14px; overflow:hidden; background:#eef2f7; }
    .heatmap-status { margin-top:8px; color:#333; font-size:12px; background:#fff; border:1px solid #d0d0d0; border-radius:10px; padding:8px 10px; }
    .progress-wrap {height:14px;background:#f3eff9;border-radius:99px;overflow:hidden;margin:8px 0 4px;border:1px solid #dce2e8}
    .progress-bar {height:100%;width:0%;background:#6B4AA0;transition:width .2s ease}
    .map-debug { font-family:Arial,sans-serif; background:rgba(255,255,255,.96); padding:8px 10px; border-radius:8px; border:1px solid #ccc; font-size:12px; max-width:560px; margin:10px; }
    @media (max-width:800px){ .heatmap-header{align-items:flex-start; flex-direction:column;} #clientHeatmap{height:70vh; min-height:460px;} }
  </style>
  <link rel="stylesheet" href="https://martinssystem.co.za/static/css/martins-platform.css">
</head>
<body>
  <div class="heatmap-page">
    <div class="heatmap-header">
      <div>
        <h1>Client Heatmap</h1>
        <p><strong>{{ selected }}</strong> | Client addresses only. Dashboard map shows franchise addresses only.</p>
      </div>
      <div class="heatmap-actions">
        <form method="get" action="{{ url_for('client_heatmap_page') }}" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <select name="franchise" onchange="this.form.submit()" title="Choose all clients or one franchise">
            {% for fr in franchises or ['All'] %}
              <option value="{{ fr }}" {% if fr == selected %}selected{% endif %}>{{ fr }}</option>
            {% endfor %}
          </select>
        </form>
        <a class="secondary" href="{{ url_for('dashboard', franchise=selected if selected else 'All') }}">Back to dashboard</a>
        <button type="button" id="heatOnlyBtn" onclick="window.MDSetClientMapMode && window.MDSetClientMapMode('heat')">Heatmap</button>
        <button type="button" id="pinsOnlyBtn" class="secondary" onclick="window.MDSetClientMapMode && window.MDSetClientMapMode('pins')">Pins</button>
        <button type="button" id="bothBtn" class="secondary" onclick="window.MDSetClientMapMode && window.MDSetClientMapMode('both')">Both</button>
      </div>
    </div>
    <div class="heatmap-shell">
      <div class="heatmap-status">
        <strong id="progressTitle">Preparing client map...</strong>
        <div class="progress-wrap"><div class="progress-bar" id="clientMapProgressBar"></div></div>
        <span id="clientHeatmapStatus">Waiting for Google Maps...</span>
      </div>
      <div id="clientHeatmap"><div style="padding:24px">Loading map...</div></div>
    </div>
  </div>

  <script>window.MD_HEATMAP_SELECTED = {{ selected|tojson }};</script>
  {% if google_maps_api_key %}
  <script>
    (function(){
      var map = null, infoWindow = null;
      var heatCircles = [], pinMarkers = [], visibleRows = [];
      var selected = window.MD_HEATMAP_SELECTED || 'All';
      var currentMode = selected === 'All' ? 'heat' : 'pins';
      var SA_CENTER = {lat:-30.5595, lng:22.9375};
      var requestSerial = 0, loadTimer = null, initialFitDone = false;
      var lastPayload = {count:0, clients_total:0, total_groups:0, grid_size:0, kind:'cells'};
      function byId(id){ return document.getElementById(id); }
      function status(message){ var el = byId('clientHeatmapStatus'); if(el){ el.textContent = message; } }
      function esc(v){ return String(v || '').replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); }
      function setButtonClasses(mode){
        currentMode = mode || currentMode;
        ['heatOnlyBtn','pinsOnlyBtn','bothBtn'].forEach(function(id){ var b=byId(id); if(b){ b.className='secondary'; }});
        if(currentMode === 'heat' && byId('heatOnlyBtn')) byId('heatOnlyBtn').className='';
        if(currentMode === 'pins' && byId('pinsOnlyBtn')) byId('pinsOnlyBtn').className='';
        if(currentMode === 'both' && byId('bothBtn')) byId('bothBtn').className='';
      }
      window.MDSetClientMapMode = function(mode){
        if(!map){ return; }
        setButtonClasses(mode);
        renderVisibleRows();
      };
      function updateStatus(){
        var represented = visibleRows.reduce(function(sum, row){ return sum + Math.max(0, Number(row.count || 0)); }, 0);
        var truncated = lastPayload.truncated ? ' | Showing the busiest '+visibleRows.length.toLocaleString()+' cells' : '';
        if(byId('clientMapProgressBar')) byId('clientMapProgressBar').style.width = '100%';
        if(byId('progressTitle')) byId('progressTitle').textContent = 'Client map ready';
        status('Visible map cells ' + visibleRows.length.toLocaleString() + ' | Clients represented ' + represented.toLocaleString() + ' | Mode ' + currentMode.toUpperCase() + truncated);
        var div = document.createElement('div');
        div.className = 'map-debug';
        div.innerHTML = '<b>Map status</b><br>Selected: '+esc(selected)+'<br>Visible cells: '+visibleRows.length.toLocaleString()+'<br>Clients represented: '+represented.toLocaleString();
        map.controls[google.maps.ControlPosition.TOP_LEFT].clear();
        map.controls[google.maps.ControlPosition.TOP_LEFT].push(div);
      }
      function clearOverlays(){
        heatCircles.forEach(function(c){ c.setMap(null); });
        pinMarkers.forEach(function(m){ m.setMap(null); });
        heatCircles = []; pinMarkers = [];
      }
      function pointContent(row){
        var count = Math.max(1, Number(row.count || 1));
        var heading = row.franchise || (lastPayload.kind === 'cells' ? 'Client density area' : selected);
        var detail = row.address ? '<br>'+esc(row.address) : '';
        var grouped = row.location_count ? '<br>Address groups: '+Number(row.location_count).toLocaleString() : '';
        return '<strong>'+esc(heading)+'</strong>'+detail+grouped+'<br>Clients represented: '+count.toLocaleString();
      }
      function addCircle(row, pos){
        var count = Math.max(1, Number(row.count || 1));
        var gridRadius = Math.max(0, Number(lastPayload.grid_size || 0)) * 45000;
        var radius = Math.max(300, Math.min(30000, gridRadius + Math.sqrt(count) * 80));
        var circle = new google.maps.Circle({center:pos, radius:radius, strokeColor:'#b00000', strokeOpacity:.35, strokeWeight:1, fillColor:'#ff2a00', fillOpacity:.34, clickable:true, map:map});
        circle.addListener('click', function(){ infoWindow.setContent(pointContent(row)); infoWindow.setPosition(pos); infoWindow.open(map); });
        heatCircles.push(circle);
      }
      function addMarker(row, pos){
        var count = Math.max(1, Number(row.count || 1));
        var marker = new google.maps.Marker({position:pos, map:map, title:(row.client || row.franchise || 'Client location'), label:{text:String(Math.min(count,9999)), color:'#fff', fontWeight:'700'}});
        marker.addListener('click', function(){ infoWindow.setContent(pointContent(row)); infoWindow.open(map, marker); });
        pinMarkers.push(marker);
      }
      function renderVisibleRows(){
        if(!map){ return; }
        clearOverlays();
        var showHeat = currentMode === 'heat' || currentMode === 'both';
        var showPins = currentMode === 'pins' || currentMode === 'both';
        visibleRows.forEach(function(row){
          var lat = Number(row.lat), lng = Number(row.lng);
          if(!isFinite(lat) || !isFinite(lng) || lat < -35.8 || lat > -21 || lng < 16 || lng > 33.8){ return; }
          var pos = {lat:lat, lng:lng};
          if(showHeat){ addCircle(row, pos); }
          if(showPins){ addMarker(row, pos); }
        });
        updateStatus();
      }
      function fitSelectedOnce(){
        if(initialFitDone || selected === 'All' || !visibleRows.length){ return; }
        initialFitDone = true;
        var bounds = new google.maps.LatLngBounds();
        visibleRows.forEach(function(row){
          var lat=Number(row.lat), lng=Number(row.lng);
          if(isFinite(lat) && isFinite(lng)){ bounds.extend({lat:lat,lng:lng}); }
        });
        if(!bounds.isEmpty()){ map.fitBounds(bounds); if(map.getZoom() > 11){ map.setZoom(11); } }
      }
      async function loadViewport(){
        if(!map || !map.getBounds()){ return; }
        var serial = ++requestSerial;
        var b = map.getBounds(), ne = b.getNorthEast(), sw = b.getSouthWest();
        var params = new URLSearchParams();
        params.set('franchise', selected || 'All');
        params.set('zoom', String(Math.round(map.getZoom() || 5)));
        params.set('south', String(sw.lat())); params.set('north', String(ne.lat()));
        params.set('west', String(sw.lng())); params.set('east', String(ne.lng()));
        params.set('limit', '1500');
        if(byId('progressTitle')) byId('progressTitle').textContent = 'Loading visible client density...';
        status('Loading only the clients in the visible map area...');
        try {
          var resp = await fetch('/api/client-map-viewport?' + params.toString());
          var payload = await resp.json();
          if(serial !== requestSerial){ return; }
          if(!resp.ok || !payload.ok){ throw new Error(payload.error || 'Could not load client map'); }
          lastPayload = payload;
          visibleRows = payload.locations || [];
          renderVisibleRows();
          fitSelectedOnce();
        } catch(err) {
          if(serial === requestSerial){ status('Client map loading stopped: ' + err.message); }
        }
      }
      function scheduleViewportLoad(){
        if(loadTimer){ clearTimeout(loadTimer); }
        loadTimer = setTimeout(loadViewport, 250);
      }
      window.initFullClientHeatmap = function(){
        var el = byId('clientHeatmap');
        if(!el || !window.google || !google.maps){ return; }
        map = new google.maps.Map(el, {center:SA_CENTER, zoom:5, mapTypeId:'roadmap', scrollwheel:true, gestureHandling:'greedy', fullscreenControl:true, streetViewControl:false, mapTypeControl:true});
        infoWindow = new google.maps.InfoWindow();
        setButtonClasses(currentMode);
        status('Loading prepared client density for the visible area...');
        map.addListener('idle', scheduleViewportLoad);
      };
    })();
  </script>
  <script async defer src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_api_key }}&callback=initFullClientHeatmap"></script>
  {% else %}
  <script>document.getElementById('clientHeatmap').innerHTML='<iframe title="South Africa map" width="100%" height="100%" style="border:0" loading="lazy" src="https://www.google.com/maps?q=South%20Africa&output=embed"></iframe>'; document.getElementById('clientHeatmapStatus').textContent='GOOGLE_MAPS_API_KEY is not configured. Add it to .env and prepare client map locations.';</script>
  {% endif %}
</body>
</html>
