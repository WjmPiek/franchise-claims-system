services:
  - type: web
    name: franchise-claims-system
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 900 --access-logfile - --error-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: SESSION_COOKIE_SAMESITE
        value: Lax
      - key: SESSION_TIMEOUT_MINUTES
        value: "30"
      - key: ENABLE_POLICY_AGE_SCHEDULER
        value: "0"
      - key: APP_VERSION
        value: render-production
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        value: Martins Direct Analytics
      - key: SMTP_USE_TLS
        value: "1"
      - key: CRON_SECRET
        generateValue: true
      - key: MAINTENANCE_MODE
        value: "0"
